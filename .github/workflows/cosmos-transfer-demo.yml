name: Cosmos Transfer + MuJoCo demo

on:
  workflow_dispatch:
    inputs:
      variants:
        description: "Also render the three appearance variants (extra Reactor cost)"
        type: boolean
        default: true
      frames:
        description: "Frames for the main run (1 + 4N)"
        default: "161"

permissions:
  contents: write

jobs:
  demo:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MUJOCO_GL: osmesa
      PYOPENGL_PLATFORM: osmesa
      REACTOR_API_KEY: ${{ secrets.REACTOR_API_KEY }}
    defaults:
      run:
        working-directory: cosmos-transfer-mujoco
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: System packages for headless rendering
        run: sudo apt-get update -q && sudo apt-get install -y -q libosmesa6 ffmpeg fonts-dejavu-core
      - name: Python packages
        run: pip install -q -r requirements.txt
      - name: Closed-loop run (MuJoCo -> Cosmos Transfer on Reactor)
        run: python run_demo.py --frames ${{ inputs.frames }} --output output
      - name: Appearance variants
        if: ${{ inputs.variants }}
        run: python run_demo.py --variants --output output
      - name: Videos
        run: python make_video.py --output output
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cosmos-transfer-demo
          path: |
            cosmos-transfer-mujoco/output/*.mp4
            cosmos-transfer-mujoco/output/*.gif
            cosmos-transfer-mujoco/output/*.png
            cosmos-transfer-mujoco/output/**/report.json
            cosmos-transfer-mujoco/output/report.json
      - name: Save results to the repo
        if: success()
        run: |
          mkdir -p results
          cp output/*.mp4 output/*.gif results/ 2>/dev/null || true
          cp output/variants.png results/ 2>/dev/null || true
          cp output/report.json results/report.json
          [ -f output/variants/report.json ] && cp output/variants/report.json results/variants_report.json || true
          python - <<'PY'
          from PIL import Image
          import glob
          for i, name in [(40, "frame_early"), (100, "frame_mid"), (150, "frame_late")]:
              for kind in ["sim_rgb", "cosmos_rgb"]:
                  f = sorted(glob.glob(f"output/{kind}/*.png"))
                  if len(f) > i:
                      Image.open(f[i]).save(f"results/{name}_{kind}.png")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          git commit -m "Cosmos Transfer demo results (run ${{ github.run_id }})" || exit 0
          git pull --rebase -q && git push
